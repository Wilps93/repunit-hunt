# ── Задача ────────────────────────────────────────────────
base                 = 10
k_min                = 3
k_max                = 1000000

# ── Битовое сито ──────────────────────────────────────────
# Предел q для CPU-сита. Замер (k=5000..15000, доля снятых кандидатов):
#   2^24 — 30.1% за 0.2 с (179 МиБ)     2^27 — 33.1% за 2.25 с (275 МиБ)
#   2^26 — 32.3% за 1.0 с (256 МиБ)     2^28 — 33.8% за 5.4 с (519 МиБ)
# Стадия самая дешёвая в конвейере, поэтому берём 2^27: дальше отдача падает,
# а память растёт вдвое.
bitsieve_q_limit     = 134217728

# ── Trial Factoring на GPU ────────────────────────────────
tf_enabled           = true
tf_q_min             = 134217728   # ниже уже отработало сито
tf_q_hard_max_bits   = 80          # потолок 2^80 (128-битная ветка)
tf_adaptive          = true        # глубина подбирается тюнером
tf_k_batch           = 4096        # k на один GPU-launch

# ── P-1 ───────────────────────────────────────────────────
# P-1 окупается только когда PRP-тест много дороже B1 модульных умножений,
# то есть на миллионах бит. Для диапазонов до ~10^6 бит держим выключенным:
# при B1=10^5 этап стоит 2.9*10^5 умножений против 1.6*10^5 у самого теста.
pm1_enabled          = false
pm1_b1               = 100000
pm1_b2               = 10000000
pm1_adaptive         = true

# ── PRP ───────────────────────────────────────────────────
mr_rounds            = 2
# Доля вердиктов «составное», пересчитываемых вторым бэкендом прямо в ходе
# поиска. Ловит ПОТЕРЯННЫЕ находки (ложное «составное» из-за сбоя FFT).
# 0 = выключено; 0.01 = каждый сотый. Полную перепроверку журнала постфактум
# делает `repunit-hunt --verify`.
double_check_ratio   = 0.0
prp_backend          = "auto"      # auto | gmp | gwnum
# Порог переключения GMP -> GWNUM. Измерено (bench kernels, ускорение GWNUM):
#   1017 бит 0.10x | 1994 бит 1.06x | 3010 бит 1.95x | 5017 бит 3.21x
# Пересечение около 2000 бит, берём 2500 с небольшим запасом.
gwnum_threshold_bits = 2500
gerbicz_l            = 0           # 0 = авто (≈ sqrt(bits))

# ── Ресурсы ───────────────────────────────────────────────
threads              = 0           # 0 = все ядра
pin_threads          = true
gmp_pool_mb          = 64
queue_depth          = 8192
gpu_devices          = []          # [] = все

# ── I/O ───────────────────────────────────────────────────
worklog              = "worklog.jsonl"
results              = "results.json"
checkpoint_secs      = 60