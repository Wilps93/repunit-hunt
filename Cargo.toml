[package]
name         = "repunit-hunt"
version      = "2.0.0"
edition      = "2021"
rust-version = "1.75"
build        = "build.rs"
license      = "MIT OR Apache-2.0"
description  = "Hybrid CPU/GPU search for generalized repunit primes R_k(b)=(b^k-1)/(b-1)"

[dependencies]
rayon             = "1.10"
clap              = { version = "4.5", features = ["derive"] }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
toml              = "0.8"
anyhow            = "1.0"
thiserror         = "2.0"
log               = "0.4"
env_logger        = "0.11"
crossbeam-channel = "0.5"
num_cpus          = "1.16"
parking_lot       = "0.12"
mimalloc          = { version = "0.1", default-features = false }
libc              = "0.2"
hwloc2            = { version = "2.2", optional = true }

[build-dependencies]
cc     = "1.1"
anyhow = "1.0"

[features]
default  = ["cuda", "gwnum", "pm1"]
cuda     = []
gwnum    = []   # требует GWNUM (Prime95 SDK); GMP_DIR/GWNUM_DIR
pm1      = []   # требует libecm
numa     = ["hwloc2"]

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = 1

[[bench]]
name    = "kernels"
harness = false